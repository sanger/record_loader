name: Ruby Tests

env:
  TZ: Europe/London

on:
  push:
  pull_request:

jobs:
  test:
    name: Rspec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: sanger/.github/.github/actions/setup/checkout@master

      - name: Setup Ruby
        uses: sanger/.github/.github/actions/setup/ruby@master

      - name: Run rspec
        run: bundle exec rspec
